name: Deploy to GitHub Pages

on:
  # Deploy on every push to the default branch, and allow a manual run.
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token plus the permissions the Pages deployment needs.
# `deployments: read` is what lets the deploy job SEE a deployment that is still
# in progress (the Deployments API listing); cancelling one is covered by
# `pages: write`.
permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push supersedes an in-flight run.
# It KEEPS that purpose alongside the unblock steps below: a superseded run is
# killed where it stands, and the deploy action has no cancellation hook, so it
# can leave its deployment in progress — which is precisely what the newer run's
# "clear a stuck Pages deployment" step then cancels before deploying. Because
# this group admits one live run at a time, and nothing else deploys Pages here,
# any in-progress Pages deployment seen from inside the deploy job is a leftover.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      failed_tags: ${{ steps.frozen.outputs.failed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Retry npm ci: the native deps (sharp/onnxruntime-node) fetch prebuilt
        # binaries in their install scripts, so a transient registry/network
        # hiccup can fail a single attempt. Retry up to 3x; a genuine failure
        # (all attempts) still exits non-zero.
        run: |
          n=0; until npm ci; do n=$((n+1)); [ "$n" -ge 3 ] && exit 1; echo "npm ci failed, retry $n after 15s"; sleep 15; done

      # GITHUB_ACTIONS is set on the runner, so vite.config.ts picks the
      # /Heart-of-Africa-Remake/ base path for correct Pages asset URLs.
      - name: Build
        run: npm run build

      # Frozen playable builds of each tag under /Heart-of-Africa-Remake/<tag>/
      # (TASKS point 103): the same Pages site serves main at the root and each
      # tag at its subpath — GitHub allows one Pages site per repository, so
      # every frozen build is a subdirectory of the same artifact, built from
      # its immutable tag. The set is EVERY version tag (vX.Y)
      # plus `poc` — version tags are enumerated DYNAMICALLY so a new release
      # needs no workflow edit. Each tag is guarded so the workflow still deploys
      # the ones that exist while another does not.
      #
      # `poc` and the version tags are coupled ONE WAY ONLY (user decision
      # 20.09.2026, replacing 24.07.2026): publishing a NEW version tag pulls
      # `poc` up to it, but `poc` may run AHEAD of the newest version tag — it
      # is the current playable build and is moved on request, without a
      # closing run. So `poc` is not a release and points wherever it was last
      # set, which is usually a main commit between two versions.
      #
      # A frozen tag's site is immutable, so it is built ONCE per tag sha and
      # reused from the cache afterwards: rebuilding every tag on every push re-ran
      # a network-dependent `npm ci` per tag, and one flaky download in a frozen
      # tree took main's deploy down with it (point 663, 12.08.2026). `poc` moves,
      # so its sha changes the key and it rebuilds exactly when it moved.
      - name: Resolve the frozen tags and their commits
        id: tags
        run: |
          mkdir -p tag-cache
          VERSION_TAGS=$(git ls-remote --tags origin 'refs/tags/v*' | sed 's#.*refs/tags/##' | grep -vE '\^\{\}$' | sort -u)
          : > tag-cache/wanted.txt
          for tag in $VERSION_TAGS poc; do
            sha=$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')
            if [ -z "$sha" ]; then
              echo "tag $tag does not exist yet — skipping"
              continue
            fi
            echo "$tag $sha" >> tag-cache/wanted.txt
          done
          cat tag-cache/wanted.txt
          echo "key=frozen-tags-$(sha256sum tag-cache/wanted.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the frozen tag builds
        id: tag_cache
        uses: actions/cache/restore@v4
        with:
          path: tag-cache/builds
          key: ${{ steps.tags.outputs.key }}
          # Any older set still holds the builds of the tags that did not move.
          restore-keys: frozen-tags-

      - name: Build each tag's frozen site (all version tags + poc)
        id: frozen
        # The CUDA download is SKIPPED: onnxruntime-node is a transitive server-side
        # dep of kokoro-js that a `vite build` never executes, its postinstall pulls a
        # ~300 MB GPU tarball from a GitHub release, and that download ECONNRESET
        # three times in one evening (12.08.2026) — a frozen tag's build died on an
        # asset it does not use. The npm ci retry matches the main build's, above.
        # A tag that still fails is NAMED and left out; main's own site deploys
        # anyway and the deploy job's verdict turns the run red afterwards.
        env:
          npm_config_onnxruntime_node_install_cuda: skip
        run: |
          mkdir -p tag-cache/builds
          failed=""
          while read -r tag sha; do
            build="tag-cache/builds/$tag-$sha"
            if [ -d "$build" ]; then
              echo "tag $tag ($sha): cached build reused"
            else
              echo "tag $tag ($sha): building"
              if git fetch --depth 1 origin tag "$tag" \
                && git worktree add "src-$tag" "$tag" \
                && ( cd "src-$tag" && { n=0; until npm ci; do n=$((n+1)); [ "$n" -ge 3 ] && exit 1; echo "npm ci failed, retry $n after 15s"; sleep 15; done; } && npx tsc -b && npx vite build --base="/Heart-of-Africa-Remake/$tag/" ); then
                mkdir -p "$build"
                cp -r "src-$tag/dist/." "$build/"
              else
                echo "::error title=Frozen tag build failed::tag $tag ($sha) did not build; main and the other tags deploy without it."
                failed="$failed $tag"
                continue
              fi
            fi
            mkdir -p "dist/$tag"
            cp -r "$build/." "dist/$tag/"
          done < tag-cache/wanted.txt
          # Keep only the builds of the current tag commits in the saved cache.
          for dir in tag-cache/builds/*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            grep -qxF "${name%-*} ${name##*-}" tag-cache/wanted.txt || rm -rf "$dir"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"

      - name: Save the frozen tag builds
        # Not after a failed tag: the saved set would lack it under a key that
        # claims the full set, and the next run would never rebuild it.
        if: steps.tag_cache.outputs.cache-hit != 'true' && steps.frozen.outputs.failed == ''
        uses: actions/cache/save@v4
        with:
          path: tag-cache/builds
          key: ${{ steps.tags.outputs.key }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Everything below this line talks to the Pages API only — our build is the
  # `build` job above, and `needs: build` means a failing build never reaches
  # here. That split is what makes the retry safe: it can only ever repeat the
  # GitHub-side half, never re-run (and never mask) a build failure.
  #
  # RESIDUAL (run 32044141828, 17.08.2026): GitHub returned HTTP 429 while
  # downloading actions/deploy-pages@v4 in `Set up job`, before any job step
  # existed. No step in this file can retry that failure; only a job-level
  # re-run can help.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # MEASURED against the run history, not guessed (06.08.2026). A healthy
    # deploy job finishes in 9-16 s; the slowest that ever succeeded took
    # 10 m 11 s (run 31108927749), and the steps below bound it structurally at
    # ~11 min anyway (300 s first attempt + the cancel + 300 s retry). 25 min is
    # that worst case with room to spare, and nothing here has ever come close.
    #
    # It did NOT contribute to the cancellation of 06.08.2026: the deploy job of
    # run 31117749040 ended `cancelled` 15 m 31 s after it was created with ZERO
    # steps recorded — it never got a runner, and `timeout-minutes` only starts
    # counting once a job actually runs. The decisive counter-evidence is the
    # `build` job, which carries NO timeout of ours (GitHub's 360-minute
    # default): in runs 31123203073, 31120476738 and 31125129661 it died in
    # exactly the same shape after 15 m 01 s, 15 m 01 s and 15 m 02 s, annotated
    # "The job was not acquired by Runner of type hosted even after multiple
    # attempts". That is GitHub's own runner-acquisition limit, which no value
    # here raises or lowers. Kept at 25.
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # Only the deploy helpers — no build, no npm install.
      - name: Check out the deploy helpers
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      # BOUNDED on purpose (measured 06.08.2026): the default 10-minute wait
      # ended as a bare `Timeout reached, aborting!` and left the deployment
      # in progress, blocking every later one. Five minutes is well past a
      # healthy deployment, and the steps below turn the wait into a REPORT.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000

      # A stall is cleared, not left behind: cancel whatever still holds the
      # Pages queue and decide (in a pure, tested function) why the one retry is
      # warranted. With nothing to clear, the failure may be a GitHub-side
      # transient; repeating only this bounded API step is safe here.
      - name: Clear a stuck Pages deployment
        id: unblock
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pages-deploy-unblock.mjs --cancel

      - name: Deploy to GitHub Pages (retry once)
        id: deployment_retry
        if: steps.unblock.outputs.retry == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000

      # The verdict is explicit, so a stall can never end as a green run and a
      # red one always NAMES what blocks it.
      - name: Verdict
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FIRST: ${{ steps.deployment.outcome }}
          RETRY: ${{ steps.deployment_retry.outcome }}
          FAILED_TAGS: ${{ needs.build.outputs.failed_tags }}
        run: |
          if [ "$FIRST" = "success" ] || [ "$RETRY" = "success" ]; then
            echo "Pages deployment succeeded (first attempt: $FIRST, retry: ${RETRY:-skipped})."
            if [ -n "$FAILED_TAGS" ]; then
              echo "::error title=Frozen tags missing::deployed without the tag(s) $FAILED_TAGS, whose build failed in the build job."
              exit 1
            fi
            exit 0
          fi
          echo "::error title=Pages deploy failed::first attempt: $FIRST, retry: ${RETRY:-skipped}. The report below names every Pages deployment still holding the queue."
          node scripts/pages-deploy-unblock.mjs || true
          exit 1
